[workspace]
members = [
    "crates/xray-rs-types",
    "crates/xray-rs-proto",
    "crates/xray-rs-inbound",
    "crates/xray-rs-route",
    "crates/xray-rs-outbound",
    "crates/xray-rs-cli",
    "crates/xray-rs-tests",
]
resolver = "2"

[workspace.package]
version = "2.0.2"
edition = "2024"
authors = ["abc15018045126", "Xray Rust Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abc15018045126/xray-rs"
homepage = "https://github.com/abc15018045126/xray-rs"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
tokio-tungstenite = "0.24"
httparse = "1.9"
socket2 = "0.5"
ipnet = "2"
clap = { version = "4.5", features = ["derive"] }
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hex = "0.4"
pingora-pool = "0.9.1"
pingora-http = "0.9.1"
pingora-timeout = "0.9.1"
pingora-load-balancing = { version = "0.9.1", features = ["rustls"] }
hickory-resolver = { version = "0.26", features = ["system-config", "tokio", "https-ring", "tls-ring", "webpki-roots"] }
hickory-proto = "0.26"
tokio-util = { version = "0.7", features = ["codec", "io"] }
ipstack = "1.0.1"
network-interface = "2"
tun = { version = "0.8.14", features = ["async"] }
wintun = { package = "wintun-rs", version = "0.0.6" }
windows = { version = "0.62", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus"
] }
