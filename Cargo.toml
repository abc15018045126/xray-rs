[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2024"
authors = ["abc15018045126", "Xray Rust Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abc15018045126/xray-rs"
homepage = "https://github.com/abc15018045126/xray-rs"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
futures = "0.3"
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
tokio-tungstenite = "0.24"
httparse = "1.9"
socket2 = "0.5"
ipnet = "2"
clap = { version = "4.5", features = ["derive"] }
pingora-pool = "0.9.1"
pingora-http = "0.9.1"
pingora-timeout = "0.9.1"
pingora-load-balancing = { version = "0.9.1", features = ["rustls"] }
hickory-resolver = { version = "0.26", features = ["system-config", "tokio", "https-ring", "tls-ring", "webpki-roots"] }
